<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuarios - Los Apostoles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestion de Usuarios (CRUD)</h1>

        <div class="card">
            <h2 id="form-title">Crear Usuario</h2>
            <form id="user-form">
                <input type="hidden" id="user-id">
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Perez">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="Ej. juan@mail.com">
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" required placeholder="Ej. 25">
                </div>

                <button type="submit" id="btn-submit" class="btn btn-success">Guardar Usuario</button>
                <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">Cancelar Edición</button>
            </form>
        </div>

        <div class="card search-box">
            <h2>Buscar Usuario por ID</h2>
            <div class="search-group">
                <input type="number" id="search-id" placeholder="Ingresa ID del usuario">
                <button id="btn-search" class="btn btn-primary">Buscar</button>
            </div>
            <div id="search-result"></div>
        </div>

        <div class="card">
            <h2>Lista de Usuarios</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Edad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
